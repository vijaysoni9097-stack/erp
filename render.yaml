# Both existing services now build from this repository and branch.
# Update the existing API service's repository once; preserve all Render secrets.
services:
  - type: web
    name: pharmacy-erp-testing-api
    runtime: docker
    repo: https://github.com/vijaysoni9097-stack/erp
    branch: feature/ui_0.2
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SCHEMA
        value: erp_app
      - key: REQUIRE_POSTGRES
        value: 'true'
      - key: DEBUG
        value: 'false'
      - key: CORS_ORIGINS
        sync: false
  - type: web
    name: pharmacy-erp-testing-ui
    runtime: static
    repo: https://github.com/vijaysoni9097-stack/erp
    branch: feature/ui_0.2
    rootDir: frontend
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - frontend/**
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
