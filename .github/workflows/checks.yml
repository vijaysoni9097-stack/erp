name: Pharmacy ERP checks
on:
  push:
    paths:
      - frontend/**
      - backend/**
      - scripts/run_backend_tests.py
      - package.json
      - package-lock.json
      - render.yaml
      - .github/workflows/**
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-hosting.txt
      - run: pip install -r backend/requirements-hosting.txt
      - run: python scripts/run_backend_tests.py
      - name: Check API Docker image
        run: docker build -t pharmacy-erp-api:ci backend
